<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>todaybgm セルフテスト</title>
<style>
  body { font-family: "Segoe UI", "Yu Gothic UI", sans-serif; background: #E8EDF5; color: #3A4256; margin: 0; padding: 16px; }
  h1 { font-size: 18px; }
  h2 { font-size: 14px; margin: 18px 0 6px; }
  #summary { font-size: 16px; font-weight: bold; padding: 10px 14px; border-radius: 10px; background: #fff; }
  #summary.pass { color: #1a7f37; }
  #summary.fail { color: #c62828; }
  table { border-collapse: collapse; width: 100%; background: #fff; border-radius: 10px; font-size: 12px; }
  td { padding: 4px 8px; border-bottom: 1px solid #E8EDF5; }
  td.ok { color: #1a7f37; white-space: nowrap; }
  td.ng { color: #c62828; white-space: nowrap; }
  td.detail { color: #8A93A8; }
  #app-frame { width: 375px; height: 700px; border: 1px solid #cdd5e3; border-radius: 10px; background: #fff; }
  .note { font-size: 12px; color: #8A93A8; }
</style>
</head>
<body>
<h1>todaybgm セルフテスト</h1>
<p class="note">アプリを iframe に読み込み、localStorage を仕込みながらコアロジックを検証する。
リリース前に <code>tests\run.ps1</code> で全実行すること(手動なら <code>python -m http.server 8765</code> → このページを開く)。</p>
<div id="summary">実行中…</div>
<div id="results"></div>
<h2>テスト対象アプリ(iframe)</h2>
<iframe id="app-frame" src="about:blank"></iframe>

<script>
"use strict";

/* ==== 本番データ保護ガード ====
 * このページは localStorage を破壊的に書き換えるため、localhost 以外では絶対に実行しない。
 * (tests/ はデプロイにも含まれるので、本番URLで開かれた場合の事故を防ぐ) */
const ALLOWED_HOSTS = ["localhost", "127.0.0.1"];
if (!ALLOWED_HOSTS.includes(location.hostname)) {
  document.body.innerHTML = "<h1>このテストは localhost 専用です</h1><p>localStorage を書き換えるため、本番ドメインでは実行しません。</p>";
  throw new Error("not localhost");
}

/* ==== テストフレームワーク(最小) ==== */
const results = []; // {suite, name, ok, detail}
let currentSuite = "";
function suite(name) { currentSuite = name; }
function check(name, cond, detail) {
  results.push({ suite: currentSuite, name, ok: !!cond, detail: cond ? "" : String(detail || "") });
}
function eq(name, actual, expected) {
  const ok = JSON.stringify(actual) === JSON.stringify(expected);
  results.push({ suite: currentSuite, name, ok, detail: ok ? "" : `got=${JSON.stringify(actual)} want=${JSON.stringify(expected)}` });
}
function near(name, actual, expected, tol) {
  const ok = typeof actual === "number" && Math.abs(actual - expected) <= (tol || 1e-9);
  results.push({ suite: currentSuite, name, ok, detail: ok ? "" : `got=${actual} want=${expected}` });
}

function renderResults() {
  const total = results.length, ng = results.filter(r => !r.ok).length;
  const sum = document.getElementById("summary");
  sum.textContent = ng === 0 ? `ALL PASS (${total}/${total})` : `FAIL ${ng}/${total}`;
  sum.className = ng === 0 ? "pass" : "fail";
  const box = document.getElementById("results");
  box.innerHTML = "";
  let last = "";
  let table = null;
  for (const r of results) {
    if (r.suite !== last) {
      last = r.suite;
      const h = document.createElement("h2");
      h.textContent = r.suite;
      box.appendChild(h);
      table = document.createElement("table");
      box.appendChild(table);
    }
    const tr = document.createElement("tr");
    tr.innerHTML = `<td class="${r.ok ? "ok" : "ng"}">${r.ok ? "PASS" : "FAIL"}</td><td></td><td class="detail"></td>`;
    tr.children[1].textContent = r.name;
    tr.children[2].textContent = r.detail;
    table.appendChild(tr);
  }
}

// ヘッドレス実行用: 結果をHTTPサーバのアクセスログに残す(run.ps1 がこの行をgrepする)
function reportToServer() {
  const total = results.length, fails = results.filter(r => !r.ok);
  let msg;
  if (fails.length === 0) msg = `ALLPASS-${total}`;
  else msg = `FAIL-${fails.length}of${total}--` + fails.slice(0, 5).map(r => r.name.slice(0, 40)).join(";");
  fetch("/__RESULT__/" + encodeURIComponent(msg)).catch(() => {});
}

/* ==== アプリ(iframe)操作ヘルパー ==== */
const frame = document.getElementById("app-frame");
function win() { return frame.contentWindow; }
function doc() { return frame.contentDocument; }
const sleep = ms => new Promise(r => setTimeout(r, ms));

// localStorage は同一オリジン共有なので、このページから直接仕込める
function seedLS(obj) {
  localStorage.clear();
  for (const [k, v] of Object.entries(obj || {})) localStorage.setItem(k, JSON.stringify(v));
}

// アプリをiframeに(再)読み込みし、boot完了(songs.json取得→今日の曲描画)まで待つ
let bootCount = 0;
async function bootApp(seed, extraQuery) {
  seedLS(seed);
  frame.src = "/index.html?selftest=" + (++bootCount) + (extraQuery || "");
  const deadline = Date.now() + 20000;
  while (Date.now() < deadline) {
    try {
      const d = doc();
      const title = d && d.getElementById("song-title");
      // renderSong が曲名を入れたら boot 完了(bgm_daily も書かれている)
      if (title && title.textContent.trim() && localStorage.getItem("bgm_daily")) return;
      if (title && title.textContent.includes("読み込めませんでした")) throw new Error("songs.json load failed");
    } catch (e) { if (String(e).includes("songs.json")) throw e; }
    await sleep(100);
  }
  throw new Error("boot timeout");
}

/* ==== テスト本体 ==== */
async function main() {
  const songsRes = await fetch("/songs.json", { cache: "no-cache" });
  const CATALOG = await songsRes.json();
  const byGenre = g => CATALOG.filter(s => s.genres.includes(g));
  const pianoSong = byGenre("piano")[0];
  const edmSong = byGenre("edm")[0];
  const [songA, songB] = CATALOG.slice(0, 2);
  const NOW_ISO = new Date().toISOString();

  /* ---- Suite 1: 起動・カタログ健全性 ---- */
  suite("1. 起動・カタログ健全性");
  await bootApp({ bgm_settings: { genres: ["piano"], duration: "any" } });
  const w = win();
  check("今日の曲が描画される(#song-titleが非空)", doc().getElementById("song-title").textContent.trim().length > 0);
  const daily1 = JSON.parse(localStorage.getItem("bgm_daily"));
  check("bgm_daily が今日の日付で保存される", daily1 && daily1.date === w.todayStr(), JSON.stringify(daily1));
  check("選ばれた曲がカタログ内に存在する", CATALOG.some(s => s.id === daily1.currentId), daily1.currentId);
  check("設定済みならセットアップ通知が非表示", doc().getElementById("setup-notice").style.display === "none");
  const plays1 = JSON.parse(localStorage.getItem("bgm_plays") || "{}");
  check("提示された曲が bgm_plays の first に記録される(recordShown)",
    plays1[w.todayStr()] && plays1[w.todayStr()].first === daily1.currentId);
  const recent1 = JSON.parse(localStorage.getItem("bgm_recent") || "{}");
  check("提示された曲が bgm_recent(3日減衰用)に記録される",
    (recent1[w.todayStr()] || []).includes(daily1.currentId));
  check("decideToday(false) は同じ曲を返す(1日1曲の安定性)", w.decideToday(false).id === daily1.currentId);
  const og = p => { const m = doc().querySelector(`meta[property="${p}"]`); return m && m.getAttribute("content"); };
  check("OGPメタタグ: og:title / og:image / twitter:card が揃っている",
    og("og:title") && og("og:image") === "https://todaybgm.pages.dev/ogp.png" &&
    doc().querySelector('meta[name="twitter:card"]'));
  const about = doc().getElementById("about-card");
  check("設定タブ:「このアプリについて」にバージョン・ポリシー・フィードバック導線",
    about && about.querySelector("#app-version") &&
    about.querySelector('a[href="privacy.html"]') &&
    about.querySelector('a[href^="mailto:todaybgm.contact@gmail.com"]'));
  const knownGenres = new Set(["nature","game","japanese","synthwave","classical","lofi","fantasy","celtic","jazz","kawaii","piano","edm"]);
  const badSongs = CATALOG.filter(s => !s.id || !s.title || !Array.isArray(s.genres) || !s.genres.length ||
    !["short","medium","long"].includes(s.durationClass) || !s.genres.every(g => knownGenres.has(g)));
  check(`カタログ全${CATALOG.length}曲に id/title/genres/durationClass が揃い既知ジャンルのみ`, badSongs.length === 0,
    badSongs.slice(0, 3).map(s => s.id).join(","));

  /* ---- Suite 2: レコメンドロジック ---- */
  suite("2. レコメンドロジック");
  near("genreMatch: 全タグ一致=1.0", w.genreMatch({ genres: ["piano"] }, ["piano"]), 1.0);
  near("genreMatch: 部分一致=hit/タグ数", w.genreMatch({ genres: ["piano", "jazz"] }, ["piano"]), 0.5);
  near("genreMatch: 選択なし=0", w.genreMatch({ genres: ["piano"] }, []), 0);
  near("durationMatch: 同クラス=1", w.durationMatch({ durationClass: "short" }, "short"), 1);
  near("durationMatch: 隣接クラス=0.5", w.durationMatch({ durationClass: "short" }, "medium"), 0.5);
  near("durationMatch: 2段差=0", w.durationMatch({ durationClass: "short" }, "long"), 0);
  near("durationMatch: こだわらない=1", w.durationMatch({ durationClass: "short" }, "any"), 1);
  eq("timeSlotMood: 朝5-11/昼11-17", [w.timeSlotMood(5), w.timeSlotMood(10), w.timeSlotMood(11), w.timeSlotMood(16)],
    ["morning", "morning", "focus", "focus"]);
  eq("timeSlotMood: 夕17-22/夜22-5", [w.timeSlotMood(17), w.timeSlotMood(21), w.timeSlotMood(22), w.timeSlotMood(4)],
    ["calm", "calm", "night", "night"]);
  const table5 = w.buildAffinityTable({ [pianoSong.id]: { rating: 5, ratedAt: NOW_ISO } });
  check("buildAffinityTable: ★5でそのジャンルが正", table5["piano"] > 0, JSON.stringify(table5));
  const table1 = w.buildAffinityTable({ [pianoSong.id]: { rating: 1, ratedAt: NOW_ISO } });
  check("buildAffinityTable: ★1でそのジャンルが負", table1["piano"] < 0, JSON.stringify(table1));
  check("buildAffinityTable: ★3は影響しない",
    Object.keys(w.buildAffinityTable({ [pianoSong.id]: { rating: 3, ratedAt: NOW_ISO } })).length === 0);
  near("ratingAffinity: タグ平均", w.ratingAffinity({ genres: ["piano"], mood: ["calm"] }, { piano: 1, calm: 0.5 }), 0.75);
  // pickSong: 候補をA/Bの2曲に絞り、Bを★1にする → 必ずAが返る
  const deadAllButAB = CATALOG.map(s => s.id).filter(id => id !== songA.id && id !== songB.id);
  seedLS({ bgm_dead: deadAllButAB, bgm_ratings: { [songB.id]: { rating: 1, ratedAt: NOW_ISO } } });
  check("pickSong: 再生不能(dead)と★1〜2は候補から除外", w.pickSong([]).id === songA.id);
  // 全滅時の緩和: 唯一の候補Aが★1でも、低評価除外を緩和してAを返す
  seedLS({ bgm_dead: CATALOG.map(s => s.id).filter(id => id !== songA.id),
           bgm_ratings: { [songA.id]: { rating: 1, ratedAt: NOW_ISO } } });
  check("pickSong: 候補全滅時は低評価除外を緩和して必ず返す", w.pickSong([]).id === songA.id);
  seedLS({});
  eq("todayMode: 未設定なら既定(1日1曲/3時間)", w.todayMode(), { mode: "daily", hours: 3 });
  seedLS({ bgm_todaymode: { mode: "bogus", hours: 99 } });
  eq("todayMode: 不正値は既定へフォールバック", w.todayMode(), { mode: "daily", hours: 3 });
  seedLS({ bgm_todaymode: { mode: "interval", hours: 1 },
           bgm_daily: { date: w.todayStr(), shownIds: [songA.id], currentId: songA.id, pickedAt: Date.now() - 2 * 3600 * 1000 } });
  check("todayIntervalElapsed: 指定時間経過でtrue", w.todayIntervalElapsed() === true);
  seedLS({ bgm_todaymode: { mode: "interval", hours: 1 },
           bgm_daily: { date: w.todayStr(), shownIds: [songA.id], currentId: songA.id, pickedAt: Date.now() } });
  check("todayIntervalElapsed: 未経過ならfalse", w.todayIntervalElapsed() === false);
  seedLS({ bgm_todaymode: { mode: "last", hours: 3 },
           bgm_daily: { date: "2000-01-01", shownIds: [songA.id], currentId: songA.id, pickedAt: 1 } });
  const dLast = w.getDaily();
  check("getDaily: 「前回の曲」モードは日付が変わっても曲を引き継ぐ",
    dLast.date === w.todayStr() && dLast.currentId === songA.id, JSON.stringify(dLast));
  seedLS({ bgm_daily: { date: "2000-01-01", shownIds: [songA.id], currentId: songA.id } });
  const dNew = w.getDaily();
  check("getDaily: 「1日1曲」モードは日付が変わると新規(currentId=null)",
    dNew.date === w.todayStr() && dNew.currentId === null, JSON.stringify(dNew));

  /* ---- Suite 3: 履歴・カタログ外曲 ---- */
  suite("3. 履歴・カタログ外曲");
  const EXT_ID = "zz_test_ext_1";
  seedLS({ bgm_songmeta: { [EXT_ID]: { t: "テスト用カタログ外曲", g: "piano" } } });
  const ext = w.externalSong(EXT_ID);
  check("externalSong: メタありは タイトル/ジャンル を復元", ext.title === "テスト用カタログ外曲" && ext.genres[0] === "piano" && ext.metaKnown);
  const ext2 = w.externalSong("zz_no_meta");
  check("externalSong: メタなしは「カタログ外の曲」", ext2.title === "カタログ外の曲" && !ext2.metaKnown);
  seedLS({});
  w.saveSongMeta(pianoSong);
  const meta1 = JSON.parse(localStorage.getItem("bgm_songmeta"));
  check("saveSongMeta: タイトルと第1ジャンルを控える",
    meta1[pianoSong.id] && meta1[pianoSong.id].t === pianoSong.title && meta1[pianoSong.id].g === pianoSong.genres[0]);
  seedLS({ bgm_songmeta: { zz_unused: { t: "x", g: "y" } },
           bgm_ratings: { [songA.id]: { rating: 5, ratedAt: NOW_ISO } }, bgm_plays: {} });
  w.backfillSongMeta();
  const meta2 = JSON.parse(localStorage.getItem("bgm_songmeta"));
  check("backfillSongMeta: 在籍曲のメタを補完し、未参照メタを掃除",
    meta2[songA.id] && meta2[songA.id].t === songA.title && !meta2["zz_unused"], JSON.stringify(meta2));
  seedLS({ bgm_ratings: { [songA.id]: { rating: 4, ratedAt: "2026-07-20T12:00:00.000Z" } } });
  localStorage.removeItem("bgm_plays");
  w.migratePlaysFromRatings();
  const mig = JSON.parse(localStorage.getItem("bgm_plays") || "{}");
  const migDay = Object.keys(mig)[0];
  check("migratePlaysFromRatings: 履歴なしなら評価から復元",
    migDay && mig[migDay].first === songA.id && mig[migDay].plays.includes(songA.id), JSON.stringify(mig));
  seedLS({ bgm_plays: {}, bgm_ratings: { [songA.id]: { rating: 4, ratedAt: NOW_ISO } } });
  w.migratePlaysFromRatings();
  eq("migratePlaysFromRatings: 既に履歴キーがあれば何もしない(リセット後の再移行防止)",
    JSON.parse(localStorage.getItem("bgm_plays")), {});
  // カレンダー描画: 今日=first未再生+別曲再生、別日=カタログ外曲
  const today = w.todayStr();
  const ym = today.slice(0, 7);
  const otherDay = today.endsWith("-01") ? `${ym}-02` : `${ym}-01`;
  seedLS({
    bgm_plays: {
      [today]: { first: songA.id, plays: [songB.id] },
      [otherDay]: { first: EXT_ID, plays: [EXT_ID] },
    },
    bgm_songmeta: { [EXT_ID]: { t: "テスト用カタログ外曲", g: "piano" } },
  });
  w.renderCalendar();
  const calTitle = doc().getElementById("cal-title").textContent;
  const wantTitle = `${Number(today.slice(0, 4))}年${Number(today.slice(5, 7))}月`;
  check("renderCalendar: 今月のタイトルを表示", calTitle === wantTitle, calTitle);
  const thumbCells = doc().querySelectorAll("#cal-grid .cal-cell.has-thumb").length;
  check("renderCalendar: 履歴のある2日にサムネセル", thumbCells === 2, `has-thumb=${thumbCells}`);
  w.renderDayDetail(today);
  const rowsToday = [...doc().querySelectorAll("#day-list .hist-item")];
  check("renderDayDetail: 再生曲+first未再生の「未再生」行が出る",
    rowsToday.length === 2 && rowsToday.some(li => li.textContent.includes("未再生")),
    `rows=${rowsToday.length}`);
  w.renderDayDetail(otherDay);
  const rowsOther = [...doc().querySelectorAll("#day-list .hist-item")];
  check("renderDayDetail: カタログ外曲がメタのタイトルとジャンルで表示",
    rowsOther.length === 1 && rowsOther[0].textContent.includes("テスト用カタログ外曲") && rowsOther[0].textContent.includes("ピアノ"),
    rowsOther.map(li => li.textContent).join("/"));

  /* ---- Suite 4: 同期マージ(非破壊マージ+トンボストーン) ---- */
  suite("4. 同期マージ");
  const R = (rating, iso) => ({ rating, ratedAt: iso });
  const mNull = w.mergeData({ updatedAt: 5, bgm_ratings: { a: R(5, "2026-01-02T00:00:00Z") } }, null);
  check("リモートなし: ローカル+v:1 をそのまま返す", mNull.v === 1 && mNull.bgm_ratings.a.rating === 5);
  const mNewR = w.mergeData(
    { updatedAt: 0, bgm_ratings: { a: R(2, "2026-01-01T00:00:00Z") } },
    { updatedAt: 0, bgm_ratings: { a: R(5, "2026-01-02T00:00:00Z") } });
  check("評価: ratedAtが新しい方が勝つ(リモート新)", mNewR.bgm_ratings.a.rating === 5);
  const mNewL = w.mergeData(
    { updatedAt: 0, bgm_ratings: { a: R(4, "2026-01-03T00:00:00Z") } },
    { updatedAt: 0, bgm_ratings: { a: R(1, "2026-01-02T00:00:00Z") } });
  check("評価: ratedAtが新しい方が勝つ(ローカル新)", mNewL.bgm_ratings.a.rating === 4);
  const resetT = new Date("2026-06-01T00:00:00Z").getTime();
  const mReset = w.mergeData(
    { updatedAt: 0, ratingsResetAt: resetT, bgm_ratings: {} },
    { updatedAt: 0, bgm_ratings: { old: R(5, "2026-01-01T00:00:00Z"), fresh: R(4, "2026-07-01T00:00:00Z") } });
  check("評価: ratingsResetAt以前のリモート評価は復活しない(以後の評価は残る)",
    !mReset.bgm_ratings.old && mReset.bgm_ratings.fresh && mReset.ratingsResetAt === resetT,
    JSON.stringify(mReset.bgm_ratings));
  const mPlays = w.mergeData(
    { updatedAt: 0, bgm_plays: { "2026-07-01": { first: null, plays: ["a"] } } },
    { updatedAt: 0, bgm_plays: { "2026-07-01": { first: "b", plays: ["c"] }, "2026-07-02": { first: "d", plays: ["d"] } } });
  check("履歴: 日別に和集合マージ+firstを補完",
    mPlays.bgm_plays["2026-07-01"].first === "b" &&
    JSON.stringify(mPlays.bgm_plays["2026-07-01"].plays.slice().sort()) === JSON.stringify(["a", "c"]) &&
    mPlays.bgm_plays["2026-07-02"].first === "d",
    JSON.stringify(mPlays.bgm_plays));
  const mPReset = w.mergeData(
    { updatedAt: 0, playsResetAt: new Date("2026-07-02T00:00:00").getTime(), bgm_plays: {} },
    { updatedAt: 0, bgm_plays: { "2026-07-01": { first: "a", plays: ["a"] }, "2026-07-03": { first: "b", plays: ["b"] } } });
  check("履歴: playsResetAtより前の日は復活しない(以後の日は残る)",
    !mPReset.bgm_plays["2026-07-01"] && mPReset.bgm_plays["2026-07-03"],
    JSON.stringify(mPReset.bgm_plays));
  const mDead = w.mergeData({ updatedAt: 0, bgm_dead: ["x"] }, { updatedAt: 0, bgm_dead: ["x", "y"] });
  eq("除外リスト(dead): 和集合", mDead.bgm_dead.slice().sort(), ["x", "y"]);
  const setL = { genres: ["piano"], duration: "any" }, setR = { genres: ["edm"], duration: "short" };
  const mSetR = w.mergeData({ updatedAt: 1, bgm_settings: setL }, { updatedAt: 2, bgm_settings: setR });
  const mSetL = w.mergeData({ updatedAt: 3, bgm_settings: setL }, { updatedAt: 2, bgm_settings: setR });
  check("設定: updatedAtが新しい側が勝つ(両方向)",
    mSetR.bgm_settings.genres[0] === "edm" && mSetL.bgm_settings.genres[0] === "piano" && mSetR.updatedAt === 2 && mSetL.updatedAt === 3);
  const mFwd = w.mergeData({ updatedAt: 0 }, { updatedAt: 0, bgm_future_key: { x: 1 } });
  check("前方互換: 未知キーを保持する", mFwd.bgm_future_key && mFwd.bgm_future_key.x === 1);
  localStorage.removeItem("bgm_ratings");
  w.applyData({ bgm_ratings: "garbage", bgm_dead: "not-array", bgm_playmode: 123 });
  check("applyData: 不正な型は書き込まない(壊れたリモートJSON対策)",
    localStorage.getItem("bgm_ratings") === null && localStorage.getItem("bgm_dead") === null && localStorage.getItem("bgm_playmode") === null);
  w.applyData({ bgm_ratings: { a: R(5, NOW_ISO) }, bgm_dead: ["x"], bgm_playmode: "repeat" });
  check("applyData: 正しい型は書き込まれる",
    JSON.parse(localStorage.getItem("bgm_ratings")).a.rating === 5 &&
    JSON.parse(localStorage.getItem("bgm_dead"))[0] === "x" &&
    JSON.parse(localStorage.getItem("bgm_playmode")) === "repeat");
  seedLS({ bgm_ratings: { a: R(4, NOW_ISO) } });
  w.setSyncMeta({ updatedAt: 123, ratingsResetAt: 7 });
  const col = w.collectLocal();
  check("collectLocal: 同期メタ(updatedAt/resetAt)とデータを収集",
    col.updatedAt === 123 && col.ratingsResetAt === 7 && col.bgm_ratings.a.rating === 4, JSON.stringify(col));

  /* ---- Suite 5: 探す(検索スコアリング) ---- */
  suite("5. 探す(検索スコアリング)");
  const pos = new Set(["edm"]), neg = new Set(["piano"]);
  eq("axisMembership: 正極+1/負極-1/中立0",
    [w.axisMembership("edm", pos, neg), w.axisMembership("piano", pos, neg), w.axisMembership("jazz", pos, neg)], [1, -1, 0]);
  const wM = w.searchMoodWeights(-0.6), wN = w.searchMoodWeights(0.8), wZ = w.searchMoodWeights(0);
  check("searchMoodWeights: 負=朝/正=夜/0=なし",
    Math.abs(wM.morning - 0.6) < 1e-9 && wM.night === 0 && Math.abs(wN.night - 0.8) < 1e-9 && wZ.morning === 0 && wZ.night === 0);
  near("searchMoodScore: 該当ムードの重みを合算",
    w.searchMoodScore({ mood: ["morning", "rain"] }, { morning: 0.5, rain: 0.3 }), 0.8);
  const critBase = { genres: [], time: 0, acoustic: 0, tempo: 0, rain: false, duration: "any" };
  if (edmSong) {
    seedLS({});
    const gPick = w.pickSearchSong(Object.assign({}, critBase, { genres: ["edm"] }), []);
    check("pickSearchSong: ジャンル指定はそのジャンルに絞る", gPick && gPick.genres.includes("edm"), gPick && gPick.id);
  } else {
    check("pickSearchSong: ジャンル指定はそのジャンルに絞る(edm曲なしでスキップ)", false, "カタログにedm曲がない");
  }
  seedLS({});
  const onlyPick = w.pickSearchSong(critBase, CATALOG.map(s => s.id).filter(id => id !== songA.id));
  check("pickSearchSong: excludeIdsで残り1曲ならその曲", onlyPick && onlyPick.id === songA.id, onlyPick && onlyPick.id);
  seedLS({ bgm_dead: [songA.id] });
  const deadPick = w.pickSearchSong(critBase, CATALOG.map(s => s.id).filter(id => id !== songA.id && id !== songB.id));
  check("pickSearchSong: 再生不能(dead)を除外", deadPick && deadPick.id === songB.id, deadPick && deadPick.id);

  /* ---- Suite 6: リセットとトンボストーン(破壊的なので最後) ---- */
  suite("6. リセットとトンボストーン");
  w.confirm = () => true; // 確認ダイアログを自動許可
  seedLS({ bgm_ratings: { [songA.id]: R(5, NOW_ISO) }, bgm_plays: { [today]: { first: songA.id, plays: [songA.id] } } });
  w.resetTaste();
  const syncM1 = JSON.parse(localStorage.getItem("bgm_sync"));
  check("resetTaste: 評価を消去し ratingsResetAt を記録(履歴は残す)",
    localStorage.getItem("bgm_ratings") === null && syncM1.ratingsResetAt > 0 &&
    JSON.parse(localStorage.getItem("bgm_plays"))[today].first === songA.id);
  const mAfterReset = w.mergeData(w.collectLocal(), { updatedAt: 0, bgm_ratings: { [songA.id]: R(5, "2020-01-01T00:00:00Z") } });
  eq("resetTaste後のマージ: 古いリモート評価が復活しない", mAfterReset.bgm_ratings, {});
  w.resetHistory();
  const syncM2 = JSON.parse(localStorage.getItem("bgm_sync"));
  eq("resetHistory: 履歴を空オブジェクトにして playsResetAt を記録",
    [JSON.parse(localStorage.getItem("bgm_plays")), syncM2.playsResetAt > 0], [{}, true]);
  seedLS({ bgm_settings: { genres: ["piano"], duration: "any" },
           bgm_ratings: { [songA.id]: R(5, NOW_ISO) },
           bgm_plays: { "2020-01-01": { first: songA.id, plays: [songA.id] } } });
  w.resetAll();
  await sleep(300); // init(true) の再描画を待つ
  const syncM3 = JSON.parse(localStorage.getItem("bgm_sync"));
  const playsAfter = JSON.parse(localStorage.getItem("bgm_plays") || "{}");
  check("resetAll: 設定・評価を消去し、両トンボストーンを記録",
    localStorage.getItem("bgm_settings") === null && localStorage.getItem("bgm_ratings") === null &&
    syncM3.ratingsResetAt > 0 && syncM3.playsResetAt > 0);
  check("resetAll: 過去履歴は消え、今日の曲は選び直される",
    !playsAfter["2020-01-01"] && !!JSON.parse(localStorage.getItem("bgm_daily")).currentId,
    JSON.stringify(Object.keys(playsAfter)));
  check("resetAll: セットアップ通知が再表示される", doc().getElementById("setup-notice").style.display !== "none");

  /* ---- Suite 7: エッジケース(2026-07-27総点検で追加) ---- */
  suite("7. エッジケース");
  // 日付跨ぎ: タブを開いたままでも定期チェック(60秒間隔)で今日の曲が選び直される
  seedLS({ bgm_daily: { date: "2000-01-01", shownIds: ["zz_old"], currentId: "zz_old" } });
  w.refreshTodayIfNeeded(false);
  const dRoll = JSON.parse(localStorage.getItem("bgm_daily"));
  check("日付跨ぎ: 定期チェックで今日の曲を選び直す", dRoll && dRoll.date === w.todayStr() && !!dRoll.currentId, JSON.stringify(dRoll));
  // 「開くたび」モードは定期チェックでは発動しない(タブを見ている最中に毎分曲が替わるのを防ぐ)
  seedLS({ bgm_todaymode: { mode: "always", hours: 3 },
           bgm_daily: { date: w.todayStr(), shownIds: [songA.id], currentId: songA.id, pickedAt: Date.now() } });
  w.refreshTodayIfNeeded(false);
  check("「開くたび」: 定期チェックでは選び直さない",
    JSON.parse(localStorage.getItem("bgm_daily")).currentId === songA.id);
  w.refreshTodayIfNeeded(true);
  check("「開くたび」: バックグラウンド復帰では選び直す",
    JSON.parse(localStorage.getItem("bgm_daily")).currentId !== songA.id);
  // YT IFrame API読込失敗時: 案内を出して表示を再生前に戻す(幽霊再生履歴を残さない)
  w.playbackUnavailable();
  const en = doc().getElementById("error-notice");
  check("YT API失敗: 案内表示+再生前の表示に戻す",
    en.style.display !== "none" && en.textContent.includes("動画プレイヤー") &&
    doc().getElementById("thumb").style.display === "");
  en.style.display = "none";
  // 擬似全画面の初回ヒント(動画のみの全画面は⛶ボタンへ誘導): 一度だけ表示される
  seedLS({});
  w.setPseudoFullscreen(true);
  const hint1 = doc().getElementById("fs-hint");
  check("擬似全画面の初回ヒント: 表示され bgm_fshint が記録される",
    !!hint1 && hint1.textContent.includes("全画面ボタン") && JSON.parse(localStorage.getItem("bgm_fshint")) === true);
  w.setPseudoFullscreen(false);
  if (hint1) hint1.remove();
  w.setPseudoFullscreen(true);
  check("擬似全画面の初回ヒント: 2回目以降は表示されない", !doc().getElementById("fs-hint"));
  // 擬似全画面中はアプリのタブバーを隠す(iOS実機FB対応)
  check("擬似全画面中: タブバーが非表示",
    w.getComputedStyle(doc().querySelector(".tabbar")).display === "none");
  w.setPseudoFullscreen(false);
  check("擬似全画面解除: タブバーが復帰",
    w.getComputedStyle(doc().querySelector(".tabbar")).display !== "none");

  /* ---- Suite 8: UIレイアウト(2026-07-28 修正分) ---- */
  suite("8. UIレイアウト");
  // 「いちばん好き」タイル: 長いジャンル名(ケルト音楽)でも語中改行せず1行に収まる
  const celticSong = byGenre("celtic")[0];
  seedLS({ bgm_ratings: { [celticSong.id]: R(5, NOW_ISO) } });
  w.showView("taste");
  const tTop = doc().getElementById("t-top");
  check("いちばん好き: ケルト音楽が表示される", tTop.textContent === "ケルト音楽", tTop.textContent);
  check("いちばん好き: 1行固定(white-space: nowrap)", w.getComputedStyle(tTop).whiteSpace === "nowrap");
  check("いちばん好き: フォント自動縮小で幅に収まる(はみ出しなし)",
    tTop.scrollWidth <= tTop.clientWidth, `scroll=${tTop.scrollWidth} client=${tTop.clientWidth}`);
  // このアプリについて: 2つのリンクピルがスマホ幅(375px)でも横1列に並ぶ
  w.showView("settings");
  const linkPills = Array.from(doc().querySelectorAll(".about-links .toggle-pill"));
  check("aboutリンク: 2つのピルが同じ行に並ぶ(offsetTop一致)",
    linkPills.length === 2 && linkPills[0].offsetTop === linkPills[1].offsetTop,
    linkPills.map(p => p.offsetTop).join(" vs "));
  check("aboutリンク: ラベルがピルからはみ出していない",
    linkPills.every(p => p.scrollWidth <= p.clientWidth + 1),
    linkPills.map(p => `${p.scrollWidth}/${p.clientWidth}`).join(", "));
  // 説明文: 「作業用BGM推薦アプリ。」が語中で改行されない(nowrap指定+1行に収まる)
  const aboutNw = doc().querySelector("#about-card .nowrap");
  check("about説明文: 語尾がnowrapで括られ1行に収まる",
    !!aboutNw && aboutNw.getClientRects().length === 1,
    aboutNw ? `rects=${aboutNw.getClientRects().length}` : "span missing");

  /* ---- Suite 9: 同期リマインダー(2026-07-28追加) ---- */
  suite("9. 同期リマインダー");
  const DAY = 86400000;
  // 連携済み+未同期の変更あり+最終同期から4日 → 表示
  seedLS({ bgm_sync: { linked: true, lastSync: Date.now() - 4 * DAY, dirtySince: Date.now() - DAY } });
  eq("最終同期4日前+変更あり: 経過日数を返す", w.syncReminderDays(), 4);
  w.renderSyncReminder();
  const rem = doc().getElementById("sync-reminder");
  check("リマインダーが表示され日数が入る",
    rem.style.display !== "none" && doc().getElementById("sync-reminder-days").textContent === "4");
  // 閾値未満(1日)は出さない
  seedLS({ bgm_sync: { linked: true, lastSync: Date.now() - 1 * DAY, dirtySince: Date.now() } });
  eq("最終同期1日前: 出さない", w.syncReminderDays(), 0);
  // 未同期の変更がなければ何日経っていても出さない
  seedLS({ bgm_sync: { linked: true, lastSync: Date.now() - 30 * DAY, dirtySince: 0 } });
  eq("変更なし(dirtySince=0): 出さない", w.syncReminderDays(), 0);
  // 未連携なら出さない
  seedLS({ bgm_sync: { linked: false, lastSync: 0, dirtySince: Date.now() } });
  eq("未連携: 出さない", w.syncReminderDays(), 0);
  w.renderSyncReminder();
  check("非表示に戻る", doc().getElementById("sync-reminder").style.display === "none");
  // データ変更(scheduleAutoSync)で dirtySince が記録される(同期成功でクリアされる想定)
  seedLS({ bgm_sync: { linked: true, lastSync: Date.now() } });
  w.scheduleAutoSync();
  check("scheduleAutoSync: dirtySince を記録する", JSON.parse(localStorage.getItem("bgm_sync")).dirtySince > 0);
  seedLS({ bgm_sync: { linked: false } });
  w.scheduleAutoSync();
  check("scheduleAutoSync: 未連携では記録しない", !JSON.parse(localStorage.getItem("bgm_sync")).dirtySince);

  /* ---- Suite 10: 曲指定再生・あゆみ(2026-07-28 機能追加) ---- */
  suite("10. 曲指定再生・あゆみ");
  // 曲名検索(カタログから直接選ぶ)
  check("searchCatalog: タイトル部分一致で見つかる",
    w.searchCatalog(pianoSong.title.slice(0, 12)).some(s => s.id === pianoSong.id));
  check("searchCatalog: 空クエリは空配列", w.searchCatalog("  ").length === 0);
  const qCeltic = w.searchCatalog("ケルト");
  check("searchCatalog: ジャンル名(日本語)でも探せる",
    qCeltic.length > 0 && qCeltic.every(s => s.genres.includes("celtic")));
  doc().getElementById("song-search").value = pianoSong.title.slice(0, 12);
  w.renderSongSearch();
  check("検索UI: 結果行が描画される", !!doc().querySelector("#song-search-list .hist-item"));
  // ディープリンク(?v=)とタブ直行(?tab=)
  await bootApp({ bgm_settings: { genres: ["piano"], duration: "any" } }, "&v=" + edmSong.id);
  check("ディープリンク(?v=): 指定曲が今日の曲になる",
    JSON.parse(localStorage.getItem("bgm_daily")).currentId === edmSong.id);
  check("ディープリンク: 処理後にURLからパラメータが消える", !win().location.search.includes("v="));
  await bootApp({ bgm_settings: { genres: ["piano"], duration: "any" } }, "&tab=explore");
  check("?tab=explore: 探すタブが開いた状態で起動する",
    doc().getElementById("view-explore").classList.contains("active"));
  // 実再生時間の記録と表記
  seedLS({});
  win().addListenSeconds(90);
  win().addListenSeconds(30);
  check("addListenSeconds: 今日の秒数に加算される",
    JSON.parse(localStorage.getItem("bgm_listen"))[win().todayStr()] === 120);
  eq("fmtListen: 分・時間の表記",
    [win().fmtListen(300), win().fmtListen(5400), win().fmtListen(41040)],
    ["5分", "1.5時間", "11時間"]);
  // ストリーク(連続日数)
  const t0 = win().todayStr(), t1 = win().addDays(t0, -1), t2 = win().addDays(t0, -2), t9 = win().addDays(t0, -9);
  const P = id => ({ first: id, plays: [id] });
  seedLS({ bgm_plays: { [t2]: P(songA.id), [t1]: P(songA.id), [t0]: P(songA.id) } });
  eq("calcStreak: 3日連続", win().calcStreak(), 3);
  seedLS({ bgm_plays: { [t9]: P(songA.id), [t0]: P(songA.id) } });
  eq("calcStreak: 間が空くと1", win().calcStreak(), 1);
  // usageStats+バッジ・統計タイル描画
  seedLS({ bgm_plays: { [t1]: { first: pianoSong.id, plays: [pianoSong.id] },
                        [t0]: { first: edmSong.id, plays: [edmSong.id, celticSong.id] } },
           bgm_ratings: { [pianoSong.id]: R(5, NOW_ISO) },
           bgm_listen: { [t0]: 3600 } });
  const st10 = win().usageStats();
  eq("usageStats: 日数・曲数・評価数", [st10.days, st10.songs, st10.rated], [2, 3, 1]);
  eq("usageStats: streakBest(連続2日)", st10.streakBest, 2);
  win().showView("taste");
  check("あゆみ: 進化型バッジ6系列+達成段階数の表示",
    doc().querySelectorAll("#badge-grid .badge").length === 6 &&
    doc().getElementById("badge-note").textContent.includes("段階"));
  check("あゆみ: 達成済み系列がある(はじめの一曲)", !!doc().querySelector("#badge-grid .badge.on"));
  check("統計タイル: 総再生時間が表示される", doc().getElementById("t-listen").textContent === "1.0時間");
  check("ペルソナ: ラベルが表示される", doc().getElementById("persona").style.display !== "none");
  const tbl10 = win().buildAffinityTable({ [celticSong.id]: R(5, NOW_ISO) });
  check("personaLabel: ジャンル名を含むラベルを返す",
    (win().personaLabel(tbl10) || "").includes("ケルト音楽"), win().personaLabel(tbl10));
  // おすすめの成長(★4以上率の推移)
  const accRatings = {};
  CATALOG.slice(0, 20).forEach((s, i) => {
    accRatings[s.id] = { rating: i < 10 ? 2 : 5, ratedAt: new Date(2026, 0, 1 + i).toISOString() };
  });
  seedLS({ bgm_ratings: accRatings });
  const acc10 = win().recommendAccuracy();
  eq("recommendAccuracy: はじめ0%→直近100%(各10件)", [acc10.early, acc10.recent, acc10.n], [0, 100, 10]);
  seedLS({ bgm_ratings: { [songA.id]: R(5, NOW_ISO) } });
  check("recommendAccuracy: 10件未満はnull", win().recommendAccuracy() === null);
  // 同期マージ: 実再生時間は日別max(二重計上しない)
  const mL = win().mergeData(
    { updatedAt: 1, bgm_listen: { "2026-07-20": 100, "2026-07-21": 50 } },
    { updatedAt: 2, bgm_listen: { "2026-07-21": 80, "2026-07-22": 30 } });
  eq("mergeData: bgm_listenは日別max", mL.bgm_listen,
    { "2026-07-20": 100, "2026-07-21": 80, "2026-07-22": 30 });

  /* ---- Suite 11: 実績の進化型・プロフィールカード(2026-07-28 機能追加) ---- */
  suite("11. 実績の進化・プロフィールカード");
  // 進化型実績: 段階と進捗の導出(achievementStateは純粋関数)
  const aSongs = win().getAchievement("songs");
  const s137 = win().achievementState(aSongs, { songs: 137 });
  eq("achievementState: 達成レベルと次の目標(137曲)", [s137.level, s137.next.need], [3, 200]);
  eq("achievementState: 進捗%(137/200=68%)", s137.pct, 68);
  eq("achievementState: 達成済み最高段階の名前", s137.cur.name, "50曲の出会い");
  check("achievementState: 0曲はlevel 0で最初の段階が目標",
    win().achievementState(aSongs, { songs: 0 }).level === 0 &&
    win().achievementState(aSongs, { songs: 0 }).next.need === 1);
  const gMax = win().achievementState(win().getAchievement("genres"), { genres: 12 });
  check("achievementState: 全段階達成でmaxed+100%+nextなし",
    gMax.maxed && gMax.pct === 100 && !gMax.next);
  // バッジタップ → 詳細モーダル(進捗バー・段階リスト・閉じる)
  seedLS({ bgm_plays: { [t0]: { first: pianoSong.id, plays: [pianoSong.id] } },
           bgm_ratings: { [pianoSong.id]: R(5, NOW_ISO) } });
  win().showView("taste");
  doc().querySelector("#badge-grid .badge").click();
  check("実績モーダル: バッジのタップで開く", !doc().getElementById("ach-modal").hasAttribute("hidden"));
  check("実績モーダル: 進捗バーに幅が入る", doc().getElementById("ach-fill").style.width !== "");
  eq("実績モーダル: 段階リストが全段階ぶん描画される",
    doc().querySelectorAll("#ach-tiers li").length, 6);
  check("実績モーダル: 達成済み段階に✓がつく", !!doc().querySelector("#ach-tiers li.done"));
  doc().getElementById("ach-close").click();
  check("実績モーダル: 閉じるボタンで閉じる", doc().getElementById("ach-modal").hasAttribute("hidden"));
  check("プロフィール共有ボタン: 利用日があれば表示される",
    doc().getElementById("profile-share-row").style.display !== "none");
  // 音楽プロフィール(MBTI風4軸)の導出
  const prof = win().musicProfile(
    { focus: 0.8, calm: 0.1, night: 0.5, kawaii: 0.9, piano: 0.2 }, { genres: 10 });
  eq("musicProfile: 4文字タイプコード(集中×電子×夜×探求)", prof.code, "FENX");
  check("musicProfile: ニックネームが軸を反映", prof.nickname === "夜型の集中探求家", prof.nickname);
  eq("musicProfile: データなしは中立(各軸の左極)", win().musicProfile({}, { genres: 0 }).code, "FAMS");
  // 共有カードはどちらも 1080×1920(9:16)で生成される
  const pcv = await win().buildProfileCanvas();
  check("プロフィールカード: 1080×1920で生成", pcv.width === 1080 && pcv.height === 1920);
  const acv = await win().buildAchievementCanvas(aSongs, win().achievementState(aSongs, win().usageStats()));
  check("実績カード: 1080×1920で生成", acv.width === 1080 && acv.height === 1920);
}

/* ==== 実行 ==== */
(async () => {
  const watchdog = setTimeout(() => {
    results.push({ suite: "実行", name: "タイムアウト(60秒以内に完了しない)", ok: false, detail: "" });
    renderResults(); reportToServer();
  }, 60000);
  try {
    await main();
  } catch (e) {
    results.push({ suite: "実行", name: "テスト実行中の例外", ok: false, detail: String(e && e.stack || e) });
  }
  clearTimeout(watchdog);
  renderResults();
  reportToServer();
})();
</script>
