<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>todaybgm セルフテスト</title>
<style>
  body { font-family: "Segoe UI", "Yu Gothic UI", sans-serif; background: #E8EDF5; color: #3A4256; margin: 0; padding: 16px; }
  h1 { font-size: 18px; }
  h2 { font-size: 14px; margin: 18px 0 6px; }
  #summary { font-size: 16px; font-weight: bold; padding: 10px 14px; border-radius: 10px; background: #fff; }
  #summary.pass { color: #1a7f37; }
  #summary.fail { color: #c62828; }
  table { border-collapse: collapse; width: 100%; background: #fff; border-radius: 10px; font-size: 12px; }
  td { padding: 4px 8px; border-bottom: 1px solid #E8EDF5; }
  td.ok { color: #1a7f37; white-space: nowrap; }
  td.ng { color: #c62828; white-space: nowrap; }
  td.detail { color: #8A93A8; }
  #app-frame { width: 375px; height: 700px; border: 1px solid #cdd5e3; border-radius: 10px; background: #fff; }
  .note { font-size: 12px; color: #8A93A8; }
</style>
</head>
<body>
<h1>todaybgm セルフテスト</h1>
<p class="note">アプリを iframe に読み込み、localStorage を仕込みながらコアロジックを検証する。
リリース前に <code>tests\run.ps1</code> で全実行すること(手動なら <code>python -m http.server 8765</code> → このページを開く)。</p>
<div id="summary">実行中…</div>
<div id="results"></div>
<h2>テスト対象アプリ(iframe)</h2>
<iframe id="app-frame" src="about:blank"></iframe>

<script>
"use strict";

/* ==== 本番データ保護ガード ====
 * このページは localStorage を破壊的に書き換えるため、localhost 以外では絶対に実行しない。
 * (tests/ はデプロイにも含まれるので、本番URLで開かれた場合の事故を防ぐ) */
const ALLOWED_HOSTS = ["localhost", "127.0.0.1"];
if (!ALLOWED_HOSTS.includes(location.hostname)) {
  document.body.innerHTML = "<h1>このテストは localhost 専用です</h1><p>localStorage を書き換えるため、本番ドメインでは実行しません。</p>";
  throw new Error("not localhost");
}

/* ==== テストフレームワーク(最小) ==== */
const results = []; // {suite, name, ok, detail}
let currentSuite = "";
function suite(name) { currentSuite = name; }
function check(name, cond, detail) {
  results.push({ suite: currentSuite, name, ok: !!cond, detail: cond ? "" : String(detail || "") });
}
function eq(name, actual, expected) {
  const ok = JSON.stringify(actual) === JSON.stringify(expected);
  results.push({ suite: currentSuite, name, ok, detail: ok ? "" : `got=${JSON.stringify(actual)} want=${JSON.stringify(expected)}` });
}
function near(name, actual, expected, tol) {
  const ok = typeof actual === "number" && Math.abs(actual - expected) <= (tol || 1e-9);
  results.push({ suite: currentSuite, name, ok, detail: ok ? "" : `got=${actual} want=${expected}` });
}

function renderResults() {
  const total = results.length, ng = results.filter(r => !r.ok).length;
  const sum = document.getElementById("summary");
  sum.textContent = ng === 0 ? `ALL PASS (${total}/${total})` : `FAIL ${ng}/${total}`;
  sum.className = ng === 0 ? "pass" : "fail";
  const box = document.getElementById("results");
  box.innerHTML = "";
  let last = "";
  let table = null;
  for (const r of results) {
    if (r.suite !== last) {
      last = r.suite;
      const h = document.createElement("h2");
      h.textContent = r.suite;
      box.appendChild(h);
      table = document.createElement("table");
      box.appendChild(table);
    }
    const tr = document.createElement("tr");
    tr.innerHTML = `<td class="${r.ok ? "ok" : "ng"}">${r.ok ? "PASS" : "FAIL"}</td><td></td><td class="detail"></td>`;
    tr.children[1].textContent = r.name;
    tr.children[2].textContent = r.detail;
    table.appendChild(tr);
  }
}

// ヘッドレス実行用: 結果をHTTPサーバのアクセスログに残す(run.ps1 がこの行をgrepする)
function reportToServer() {
  const total = results.length, fails = results.filter(r => !r.ok);
  let msg;
  if (fails.length === 0) msg = `ALLPASS-${total}`;
  else msg = `FAIL-${fails.length}of${total}--` + fails.slice(0, 5).map(r => r.name.slice(0, 40)).join(";");
  fetch("/__RESULT__/" + encodeURIComponent(msg)).catch(() => {});
}

/* ==== アプリ(iframe)操作ヘルパー ==== */
const frame = document.getElementById("app-frame");
function win() { return frame.contentWindow; }
function doc() { return frame.contentDocument; }
const sleep = ms => new Promise(r => setTimeout(r, ms));

// localStorage は同一オリジン共有なので、このページから直接仕込める
function seedLS(obj) {
  localStorage.clear();
  for (const [k, v] of Object.entries(obj || {})) localStorage.setItem(k, JSON.stringify(v));
}

// アプリをiframeに(再)読み込みし、boot完了(songs.json取得→今日の曲描画)まで待つ
let bootCount = 0;
async function bootApp(seed, extraQuery) {
  seedLS(seed);
  frame.src = "/index.html?selftest=" + (++bootCount) + (extraQuery || "");
  const deadline = Date.now() + 20000;
  while (Date.now() < deadline) {
    try {
      const d = doc();
      const title = d && d.getElementById("song-title");
      // renderSong が曲名を入れたら boot 完了(bgm_daily も書かれている)
      if (title && title.textContent.trim() && localStorage.getItem("bgm_daily")) return;
      if (title && title.textContent.includes("読み込めませんでした")) throw new Error("songs.json load failed");
    } catch (e) { if (String(e).includes("songs.json")) throw e; }
    await sleep(100);
  }
  throw new Error("boot timeout");
}

/* ==== テスト本体 ==== */
async function main() {
  const songsRes = await fetch("/songs.json", { cache: "no-cache" });
  const CATALOG = await songsRes.json();
  const byGenre = g => CATALOG.filter(s => s.genres.includes(g));
  const pianoSong = byGenre("piano")[0];
  const edmSong = byGenre("edm")[0];
  const [songA, songB] = CATALOG.slice(0, 2);
  const NOW_ISO = new Date().toISOString();

  /* ---- Suite 1: 起動・カタログ健全性 ---- */
  suite("1. 起動・カタログ健全性");
  await bootApp({ bgm_settings: { genres: ["piano"], duration: "any" } });
  const w = win();
  check("今日の曲が描画される(#song-titleが非空)", doc().getElementById("song-title").textContent.trim().length > 0);
  const daily1 = JSON.parse(localStorage.getItem("bgm_daily"));
  check("bgm_daily が今日の日付で保存される", daily1 && daily1.date === w.todayStr(), JSON.stringify(daily1));
  check("選ばれた曲がカタログ内に存在する", CATALOG.some(s => s.id === daily1.currentId), daily1.currentId);
  check("設定済みならセットアップ通知が非表示", doc().getElementById("setup-notice").style.display === "none");
  const plays1 = JSON.parse(localStorage.getItem("bgm_plays") || "{}");
  check("提示された曲が bgm_plays の first に記録される(recordShown)",
    plays1[w.todayStr()] && plays1[w.todayStr()].first === daily1.currentId);
  const recent1 = JSON.parse(localStorage.getItem("bgm_recent") || "{}");
  check("提示された曲が bgm_recent(3日減衰用)に記録される",
    (recent1[w.todayStr()] || []).includes(daily1.currentId));
  check("decideToday(false) は同じ曲を返す(1日1曲の安定性)", w.decideToday(false).id === daily1.currentId);
  const og = p => { const m = doc().querySelector(`meta[property="${p}"]`); return m && m.getAttribute("content"); };
  check("OGPメタタグ: og:title / og:image / twitter:card が揃っている",
    og("og:title") && og("og:image") === "https://todaybgm.pages.dev/ogp.png" &&
    doc().querySelector('meta[name="twitter:card"]'));
  const about = doc().getElementById("about-card");
  check("設定タブ:「このアプリについて」にバージョン・ポリシー・フィードバック導線",
    about && about.querySelector("#app-version") &&
    about.querySelector('a[href="privacy.html"]') &&
    about.querySelector('a[href^="mailto:todaybgm.contact@gmail.com"]'));
  const knownGenres = new Set(["nature","game","japanese","synthwave","classical","lofi","fantasy","celtic","jazz","kawaii","piano","edm"]);
  const badSongs = CATALOG.filter(s => !s.id || !s.title || !Array.isArray(s.genres) || !s.genres.length ||
    !["short","medium","long"].includes(s.durationClass) || !s.genres.every(g => knownGenres.has(g)));
  check(`カタログ全${CATALOG.length}曲に id/title/genres/durationClass が揃い既知ジャンルのみ`, badSongs.length === 0,
    badSongs.slice(0, 3).map(s => s.id).join(","));

  /* ---- Suite 2: レコメンドロジック ---- */
  suite("2. レコメンドロジック");
  near("genreMatch: 全タグ一致=1.0", w.genreMatch({ genres: ["piano"] }, ["piano"]), 1.0);
  near("genreMatch: 部分一致=hit/タグ数", w.genreMatch({ genres: ["piano", "jazz"] }, ["piano"]), 0.5);
  near("genreMatch: 選択なし=0", w.genreMatch({ genres: ["piano"] }, []), 0);
  near("durationMatch: 同クラス=1", w.durationMatch({ durationClass: "short" }, "short"), 1);
  near("durationMatch: 隣接クラス=0.5", w.durationMatch({ durationClass: "short" }, "medium"), 0.5);
  near("durationMatch: 2段差=0", w.durationMatch({ durationClass: "short" }, "long"), 0);
  near("durationMatch: こだわらない=1", w.durationMatch({ durationClass: "short" }, "any"), 1);
  eq("timeSlotMood: 朝5-11/昼11-17", [w.timeSlotMood(5), w.timeSlotMood(10), w.timeSlotMood(11), w.timeSlotMood(16)],
    ["morning", "morning", "focus", "focus"]);
  eq("timeSlotMood: 夕17-22/夜22-5", [w.timeSlotMood(17), w.timeSlotMood(21), w.timeSlotMood(22), w.timeSlotMood(4)],
    ["calm", "calm", "night", "night"]);
  const table5 = w.buildAffinityTable({ [pianoSong.id]: { rating: 5, ratedAt: NOW_ISO } });
  check("buildAffinityTable: ★5でそのジャンルが正", table5["piano"] > 0, JSON.stringify(table5));
  const table1 = w.buildAffinityTable({ [pianoSong.id]: { rating: 1, ratedAt: NOW_ISO } });
  check("buildAffinityTable: ★1でそのジャンルが負", table1["piano"] < 0, JSON.stringify(table1));
  check("buildAffinityTable: ★3は影響しない",
    Object.keys(w.buildAffinityTable({ [pianoSong.id]: { rating: 3, ratedAt: NOW_ISO } })).length === 0);
  near("ratingAffinity: タグ平均", w.ratingAffinity({ genres: ["piano"], mood: ["calm"] }, { piano: 1, calm: 0.5 }), 0.75);
  // v1.3.0: 親和度=平均×確信度(件数で縮小)。★5一発でテーブルが振り切れない(旧実装は1.0)
  near("buildAffinityTable: ★5一発の親和度は控えめ(平均1.0×確信度1/4=0.25)", table5["piano"], 0.25);
  const manyR = {};
  byGenre("piano").slice(0, 5).forEach(s => { manyR[s.id] = { rating: 5, ratedAt: NOW_ISO }; });
  check("buildAffinityTable: 評価件数が増えるほど確信度が上がる(★5×5件 > ★5×1件)",
    w.buildAffinityTable(manyR)["piano"] > table5["piano"] + 0.2,
    String(w.buildAffinityTable(manyR)["piano"]));
  // v1.3.0: 抽選プールのジャンル多様性ガード(同一ジャンル最大2曲)
  const mk = (id, genres, score) => ({ s: { id, genres, mood: [] }, score });
  const scoredFake = [mk("p1", ["piano"], 10), mk("p2", ["piano"], 9), mk("p3", ["piano"], 8),
                      mk("p4", ["piano"], 7), mk("l1", ["lofi"], 6), mk("j1", ["jazz"], 5)];
  eq("pickTopPool: 同一ジャンルは最大2曲+不足分はスコア順に補充",
    w.pickTopPool(scoredFake, 5, 2).map(t => t.s.id), ["p1", "p2", "l1", "j1", "p3"]);
  eq("pickTopPool: 単一ジャンルしか無くても必ずプールサイズまで埋まる",
    w.pickTopPool([mk("a", ["piano"], 3), mk("b", ["piano"], 2), mk("c", ["piano"], 1)], 3, 2).map(t => t.s.id),
    ["a", "b", "c"]);
  // v1.3.1: ジャンル疲労(今日提示したジャンルの回数を数え、スコアを0.8^回数で減衰)
  const piano2 = byGenre("piano")[1];
  const fat = w.genreFatigue([pianoSong.id, piano2.id, edmSong.id]);
  check("genreFatigue: 提示済み曲からジャンル別回数を数える",
    fat["piano"] === 2 && fat["edm"] === 1, JSON.stringify(fat));
  eq("genreFatigue: 空なら空テーブル", w.genreFatigue([]), {});
  const ctxBase = { settings: null, table: {}, ratings: {}, slotMood: "focus", fatigue: {} };
  const sPno = { genres: ["piano"], mood: ["calm"], durationClass: "medium" };
  const base0 = w.scoreSong(sPno, ctxBase);
  const tired2 = w.scoreSong(sPno, Object.assign({}, ctxBase, { fatigue: { piano: 2 } }));
  near("scoreSong: ジャンル疲労2回でスコア0.8^2=0.64倍", tired2 / base0, Math.pow(0.8, 2));
  near("scoreSong: 疲労の減衰は0.8^5で頭打ち",
    w.scoreSong(sPno, Object.assign({}, ctxBase, { fatigue: { piano: 99 } })) / base0, Math.pow(0.8, 5));
  check("scoreSong: 疲労は自ジャンル以外に影響しない",
    w.scoreSong({ genres: ["lofi"], mood: ["calm"], durationClass: "medium" },
      Object.assign({}, ctxBase, { fatigue: { piano: 3 } })) ===
    w.scoreSong({ genres: ["lofi"], mood: ["calm"], durationClass: "medium" }, ctxBase));
  // pickSong: 候補をA/Bの2曲に絞り、Bを★1にする → 必ずAが返る
  const deadAllButAB = CATALOG.map(s => s.id).filter(id => id !== songA.id && id !== songB.id);
  seedLS({ bgm_dead: deadAllButAB, bgm_ratings: { [songB.id]: { rating: 1, ratedAt: NOW_ISO } } });
  check("pickSong: 再生不能(dead)と★1〜2は候補から除外", w.pickSong([]).id === songA.id);
  // 全滅時の緩和: 唯一の候補Aが★1でも、低評価除外を緩和してAを返す
  seedLS({ bgm_dead: CATALOG.map(s => s.id).filter(id => id !== songA.id),
           bgm_ratings: { [songA.id]: { rating: 1, ratedAt: NOW_ISO } } });
  check("pickSong: 候補全滅時は低評価除外を緩和して必ず返す", w.pickSong([]).id === songA.id);
  seedLS({});
  eq("todayMode: 未設定なら既定(1日1曲/3時間)", w.todayMode(), { mode: "daily", hours: 3 });
  seedLS({ bgm_todaymode: { mode: "bogus", hours: 99 } });
  eq("todayMode: 不正値は既定へフォールバック", w.todayMode(), { mode: "daily", hours: 3 });
  seedLS({ bgm_todaymode: { mode: "interval", hours: 1 },
           bgm_daily: { date: w.todayStr(), shownIds: [songA.id], currentId: songA.id, pickedAt: Date.now() - 2 * 3600 * 1000 } });
  check("todayIntervalElapsed: 指定時間経過でtrue", w.todayIntervalElapsed() === true);
  seedLS({ bgm_todaymode: { mode: "interval", hours: 1 },
           bgm_daily: { date: w.todayStr(), shownIds: [songA.id], currentId: songA.id, pickedAt: Date.now() } });
  check("todayIntervalElapsed: 未経過ならfalse", w.todayIntervalElapsed() === false);
  seedLS({ bgm_todaymode: { mode: "last", hours: 3 },
           bgm_daily: { date: "2000-01-01", shownIds: [songA.id], currentId: songA.id, pickedAt: 1 } });
  const dLast = w.getDaily();
  check("getDaily: 「前回の曲」モードは日付が変わっても曲を引き継ぐ",
    dLast.date === w.todayStr() && dLast.currentId === songA.id, JSON.stringify(dLast));
  seedLS({ bgm_daily: { date: "2000-01-01", shownIds: [songA.id], currentId: songA.id } });
  const dNew = w.getDaily();
  check("getDaily: 「1日1曲」モードは日付が変わると新規(currentId=null)",
    dNew.date === w.todayStr() && dNew.currentId === null, JSON.stringify(dNew));

  /* ---- Suite 3: 履歴・カタログ外曲 ---- */
  suite("3. 履歴・カタログ外曲");
  const EXT_ID = "zz_test_ext_1";
  seedLS({ bgm_songmeta: { [EXT_ID]: { t: "テスト用カタログ外曲", g: "piano" } } });
  const ext = w.externalSong(EXT_ID);
  check("externalSong: メタありは タイトル/ジャンル を復元", ext.title === "テスト用カタログ外曲" && ext.genres[0] === "piano" && ext.metaKnown);
  const ext2 = w.externalSong("zz_no_meta");
  check("externalSong: メタなしは「カタログ外の曲」", ext2.title === "カタログ外の曲" && !ext2.metaKnown);
  seedLS({});
  w.saveSongMeta(pianoSong);
  const meta1 = JSON.parse(localStorage.getItem("bgm_songmeta"));
  check("saveSongMeta: タイトルと第1ジャンルを控える",
    meta1[pianoSong.id] && meta1[pianoSong.id].t === pianoSong.title && meta1[pianoSong.id].g === pianoSong.genres[0]);
  seedLS({ bgm_songmeta: { zz_unused: { t: "x", g: "y" } },
           bgm_ratings: { [songA.id]: { rating: 5, ratedAt: NOW_ISO } }, bgm_plays: {} });
  w.backfillSongMeta();
  const meta2 = JSON.parse(localStorage.getItem("bgm_songmeta"));
  check("backfillSongMeta: 在籍曲のメタを補完し、未参照メタを掃除",
    meta2[songA.id] && meta2[songA.id].t === songA.title && !meta2["zz_unused"], JSON.stringify(meta2));
  seedLS({ bgm_ratings: { [songA.id]: { rating: 4, ratedAt: "2026-07-20T12:00:00.000Z" } } });
  localStorage.removeItem("bgm_plays");
  w.migratePlaysFromRatings();
  const mig = JSON.parse(localStorage.getItem("bgm_plays") || "{}");
  const migDay = Object.keys(mig)[0];
  check("migratePlaysFromRatings: 履歴なしなら評価から復元",
    migDay && mig[migDay].first === songA.id && mig[migDay].plays.includes(songA.id), JSON.stringify(mig));
  seedLS({ bgm_plays: {}, bgm_ratings: { [songA.id]: { rating: 4, ratedAt: NOW_ISO } } });
  w.migratePlaysFromRatings();
  eq("migratePlaysFromRatings: 既に履歴キーがあれば何もしない(リセット後の再移行防止)",
    JSON.parse(localStorage.getItem("bgm_plays")), {});
  // カレンダー描画: 今日=first未再生+別曲再生、別日=カタログ外曲
  const today = w.todayStr();
  const ym = today.slice(0, 7);
  const otherDay = today.endsWith("-01") ? `${ym}-02` : `${ym}-01`;
  seedLS({
    bgm_plays: {
      [today]: { first: songA.id, plays: [songB.id] },
      [otherDay]: { first: EXT_ID, plays: [EXT_ID] },
    },
    bgm_songmeta: { [EXT_ID]: { t: "テスト用カタログ外曲", g: "piano" } },
  });
  w.renderCalendar();
  const calTitle = doc().getElementById("cal-title").textContent;
  const wantTitle = `${Number(today.slice(0, 4))}年${Number(today.slice(5, 7))}月`;
  check("renderCalendar: 今月のタイトルを表示", calTitle === wantTitle, calTitle);
  const thumbCells = doc().querySelectorAll("#cal-grid .cal-cell.has-thumb").length;
  check("renderCalendar: 履歴のある2日にサムネセル", thumbCells === 2, `has-thumb=${thumbCells}`);
  w.renderDayDetail(today);
  const rowsToday = [...doc().querySelectorAll("#day-list .hist-item")];
  check("renderDayDetail: 再生曲+first未再生の「未再生」行が出る",
    rowsToday.length === 2 && rowsToday.some(li => li.textContent.includes("未再生")),
    `rows=${rowsToday.length}`);
  w.renderDayDetail(otherDay);
  const rowsOther = [...doc().querySelectorAll("#day-list .hist-item")];
  check("renderDayDetail: カタログ外曲がメタのタイトルとジャンルで表示",
    rowsOther.length === 1 && rowsOther[0].textContent.includes("テスト用カタログ外曲") && rowsOther[0].textContent.includes("ピアノ"),
    rowsOther.map(li => li.textContent).join("/"));

  /* ---- Suite 4: 同期マージ(非破壊マージ+トンボストーン) ---- */
  suite("4. 同期マージ");
  const R = (rating, iso) => ({ rating, ratedAt: iso });
  const mNull = w.mergeData({ updatedAt: 5, bgm_ratings: { a: R(5, "2026-01-02T00:00:00Z") } }, null);
  check("リモートなし: ローカル+v:1 をそのまま返す", mNull.v === 1 && mNull.bgm_ratings.a.rating === 5);
  const mNewR = w.mergeData(
    { updatedAt: 0, bgm_ratings: { a: R(2, "2026-01-01T00:00:00Z") } },
    { updatedAt: 0, bgm_ratings: { a: R(5, "2026-01-02T00:00:00Z") } });
  check("評価: ratedAtが新しい方が勝つ(リモート新)", mNewR.bgm_ratings.a.rating === 5);
  const mNewL = w.mergeData(
    { updatedAt: 0, bgm_ratings: { a: R(4, "2026-01-03T00:00:00Z") } },
    { updatedAt: 0, bgm_ratings: { a: R(1, "2026-01-02T00:00:00Z") } });
  check("評価: ratedAtが新しい方が勝つ(ローカル新)", mNewL.bgm_ratings.a.rating === 4);
  const resetT = new Date("2026-06-01T00:00:00Z").getTime();
  const mReset = w.mergeData(
    { updatedAt: 0, ratingsResetAt: resetT, bgm_ratings: {} },
    { updatedAt: 0, bgm_ratings: { old: R(5, "2026-01-01T00:00:00Z"), fresh: R(4, "2026-07-01T00:00:00Z") } });
  check("評価: ratingsResetAt以前のリモート評価は復活しない(以後の評価は残る)",
    !mReset.bgm_ratings.old && mReset.bgm_ratings.fresh && mReset.ratingsResetAt === resetT,
    JSON.stringify(mReset.bgm_ratings));
  const mPlays = w.mergeData(
    { updatedAt: 0, bgm_plays: { "2026-07-01": { first: null, plays: ["a"] } } },
    { updatedAt: 0, bgm_plays: { "2026-07-01": { first: "b", plays: ["c"] }, "2026-07-02": { first: "d", plays: ["d"] } } });

  /* ---- Suite 13: ダブルタップズーム抑止(v1.3.1〜v1.3.2) ---- */

  // iOSはtouch-actionだけではスマートズームが残ることがある → viewportでも無効化(v1.3.2)。

  check("viewport: maximum-scale=1 + user-scalable=no でダブルタップズーム無効",

  /* ---- Suite 14: 作業サポート・自動再生(v1.4.0) ---- */
  suite("14. 作業サポート・自動再生(v1.4.0)");
  await bootApp({ bgm_settings: { genres: ["piano"], duration: "any" } });
  const w14 = win();
  check("タブバーに作業タブがある(6タブ)",
    doc().querySelectorAll(".tabbar .tab").length === 6 && !!doc().querySelector('.tab[data-view="work"]'));
  w14.showView("work");
  check("作業ビューが開き、タイマー・やること・あゆみが描画される",

    doc().getElementById("pomo-time").textContent === "25:00" &&
    doc().getElementById("todo-empty").style.display !== "none" &&
    doc().getElementById("work-empty").style.display !== "none");
  // ポモドーロ: 状態遷移(実時間は待たず、保存状態を直接検証する)。2セット構成で開始
  w14.save("bgm_pomoconf", { preset: "p25", sets: 2, auto: false });
  w14.pomoMain(); // 開始
  let ps14 = w14.pomoState();
  check("開始: workモード・設定どおり2セット・終了時刻が約25分後",
    ps14.mode === "work" && ps14.sets === 2 && ps14.setNo === 1 &&
    Math.abs((ps14.endAt - Date.now()) - 25 * 60 * 1000) < 3000, JSON.stringify(ps14));
  w14.pomoMain(); // 一時停止
  ps14 = w14.pomoState();
  check("一時停止: 残り秒がpausedLeftに入る", ps14.pausedLeft > 0 && ps14.pausedLeft <= 25 * 60, JSON.stringify(ps14));
  w14.pomoMain(); // 再開
  ps14 = w14.pomoState();
  check("再開: pausedLeft解除+終了時刻を再設定", ps14.pausedLeft === null && ps14.endAt > Date.now());
  // 1セット目の完了: 終了時刻を過去にしてtickさせる → 25分+完了1回を記録して休憩へ
  w14.savePomo(Object.assign(w14.pomoState(), { endAt: Date.now() - 500, runStartAt: Date.now() - 25 * 60 * 1000 - 500, acc: 0 }));
  w14.pomoTick();
  const wk1 = JSON.parse(localStorage.getItem("bgm_work"))[w14.todayStr()];
  check("1セット目の完了: 休憩モードへ移行(まだセットが残っている)", w14.pomoState().mode === "break" && w14.pomoState().setNo === 1);
  check("1セット目の完了: 作業25分+完了1回が記録される", wk1 && wk1.pomo === 1 && Math.abs(wk1.sec - 1500) <= 2, JSON.stringify(wk1));
  w14.pomoMain(); // 休憩をとばす
  ps14 = w14.pomoState();
  check("休憩をとばす: 次のセットの作業が始まる", ps14.mode === "work" && ps14.setNo === 2, JSON.stringify(ps14));
  // 中断: そこまでの時間だけ記録し、完了数は増えない
  w14.savePomo(Object.assign(w14.pomoState(), { runStartAt: Date.now() - 5 * 60 * 1000 }));
  w14.pomoStop();
  const wk2 = JSON.parse(localStorage.getItem("bgm_work"))[w14.todayStr()];
  check("中断: 経過5分だけ加算・完了数は増えない・待機に戻る",
    w14.pomoState().mode === "idle" && wk2.pomo === 1 && Math.abs(wk2.sec - 1800) <= 3, JSON.stringify(wk2));
  // 休憩明け: tickで次のセットの作業が自動で始まる
  w14.savePomo({ mode: "break", preset: "p25", sets: 3, setNo: 1, endAt: Date.now() - 100, pausedLeft: null, acc: 0, runStartAt: null, lastRunAt: 0 });
  w14.pomoTick();
  ps14 = w14.pomoState();
  check("休憩明け: 次のセットの作業が自動で始まる", ps14.mode === "work" && ps14.setNo === 2 && ps14.sets === 3, JSON.stringify(ps14));
  w14.pomoStop(); // 後片付け(経過0秒なので記録は変わらない)
  // リロード復帰(restorePomo)
  localStorage.removeItem("bgm_work"); // 記録を仕切り直して検証しやすく
  w14.savePomo({ mode: "work", preset: "p25", sets: 1, setNo: 1, endAt: Date.now() - 60000, pausedLeft: null, acc: 0, runStartAt: Date.now() - 26 * 60 * 1000, lastRunAt: 0 });
  w14.restorePomo();
  const wk3 = JSON.parse(localStorage.getItem("bgm_work"))[w14.todayStr()];
  check("復帰時: 最終セットを終えていたら完了として記録して待機へ",
    w14.pomoState().mode === "idle" && wk3.pomo === 1 && Math.abs(wk3.sec - 1500) <= 2, JSON.stringify(wk3));
  w14.savePomo({ mode: "work", preset: "p25", sets: 2, setNo: 1, endAt: Date.now() - 60000, pausedLeft: null, acc: 0, runStartAt: Date.now() - 26 * 60 * 1000, lastRunAt: 0 });
  w14.restorePomo();
  ps14 = w14.pomoState();
  const wk4 = JSON.parse(localStorage.getItem("bgm_work"))[w14.todayStr()];
  check("復帰時: セットが残っていれば作業分を記録して休憩の残りへ",
    ps14.mode === "break" && wk4.pomo === 2 &&
    ps14.endAt - Date.now() > 3 * 60 * 1000 && ps14.endAt - Date.now() <= 4 * 60 * 1000 + 2000, JSON.stringify(ps14));
  w14.pomoStop(); // 後片付け(休憩中の中断は記録なし)
  w14.savePomo({ mode: "break", preset: "p25", sets: 2, setNo: 1, endAt: Date.now() - 5 * 60 * 1000, pausedLeft: null, acc: 0, runStartAt: null, lastRunAt: 0 });
  w14.restorePomo();
  check("復帰時: 休憩明けから10分以内なら次のセットを開始", w14.pomoState().mode === "work" && w14.pomoState().setNo === 2);
  w14.pomoStop();
  w14.savePomo({ mode: "break", preset: "p25", sets: 2, setNo: 1, endAt: Date.now() - 20 * 60 * 1000, pausedLeft: null, acc: 0, runStartAt: null, lastRunAt: 0 });
  w14.restorePomo();
  check("復帰時: 予定から10分以上遅れていたら再開せず待機へ", w14.pomoState().mode === "idle");
  // 「今日の曲」画面の残り時間表示
  w14.savePomo({ mode: "work", preset: "p25", sets: 2, setNo: 1, endAt: Date.now() + 10 * 60 * 1000, pausedLeft: null, acc: 0, runStartAt: Date.now(), lastRunAt: Date.now() });

    /1\/2セット/.test(doc().getElementById("pomo-inline-btn").textContent),
    doc().getElementById("pomo-inline-btn").textContent);
  w14.pomoStop();

  // やることリスト
  const tid = w14.addTodo("  テストのToDo  ");
  check("addTodo: 前後の空白をトリムして追加", w14.todosMap()[tid].text === "テストのToDo");
  check("addTodo: 空文字は追加しない", w14.addTodo("   ") === null);
  w14.setTodoDone(tid, true);
  check("setTodoDone: doneとdoneAtが記録される", w14.todosMap()[tid].done && w14.todosMap()[tid].doneAt > 0);
  eq("todoDoneCount: 今日の完了数", w14.todoDoneCount(w14.todayStr()), 1);
  w14.removeTodo(tid);
  check("removeTodo: トンボストーン化(deleted)+一覧から消える",
    w14.todosMap()[tid].deleted === true && w14.visibleTodos().length === 0);
  const tOld = w14.addTodo("昨日終えたこと"), tKeep = w14.addTodo("まだのこと");
  w14.setTodoDone(tOld, true);
  const tm14 = w14.todosMap();
  tm14[tOld].doneAt = Date.now() - 86400000; // 完了日を昨日に
  w14.save("bgm_todos", tm14);
  eq("visibleTodos: 未完了+今日完了のみ(昨日の完了分は一覧から消える)",
    w14.visibleTodos().map(t => t.text), ["まだのこと"]);
  eq("todoDoneItems: 完了した内容を日付から振り返れる",
    w14.todoDoneItems(w14.addDays(w14.todayStr(), -1)).map(t => t.text), ["昨日終えたこと"]);
  w14.showView("work");
  check("やること一覧が描画される", doc().querySelectorAll("#todo-list .todo-item").length === 1);
  check("作業のあゆみ: 直近7日の行が描画される", doc().querySelectorAll("#work-rows .aff-row").length === 7);
  const sc14 = doc().querySelector(".scroll");
  check("作業タブ: 横スクロールが発生しない", sc14.scrollWidth <= sc14.clientWidth,
    `scrollWidth=${sc14.scrollWidth} clientWidth=${sc14.clientWidth}`);
  check("6タブ化してもタブバー・本文が横にあふれない", doc().body.scrollWidth <= win().innerWidth + 1,
    `bodyScrollWidth=${doc().body.scrollWidth} innerWidth=${win().innerWidth}`);
  check("作業のあゆみ: 今日のまとめ(時間・回数・完了数)",

    /やること完了0件/.test(doc().getElementById("work-note").textContent),
    doc().getElementById("work-note").textContent);
  // 日別詳細: 昨日の行をタップ → 完了したやることの内容が出る
  doc().querySelectorAll("#work-rows .aff-row")[5].click();
  check("日別詳細: 行のタップで開き、完了したやることの内容が見られる",
    doc().getElementById("work-day-detail").style.display !== "none" &&
    /やること完了1件/.test(doc().getElementById("work-day-sum").textContent) &&
    [...doc().querySelectorAll("#work-done-list li")].some(li => li.textContent.includes("昨日終えたこと")),
    doc().getElementById("work-day-sum").textContent);
  doc().querySelectorAll("#work-rows .aff-row")[5].click(); // もう一度タップで閉じる
  check("日別詳細: 再タップで閉じる", doc().getElementById("work-day-detail").style.display === "none");
  // 週の切り替え(‹ ›)
  check("週送り: 直近7日では›が無効", doc().getElementById("work-next").disabled === true);
  const wko = JSON.parse(localStorage.getItem("bgm_work"));
  wko[w14.addDays(w14.todayStr(), -8)] = { sec: 600, pomo: 1 }; // 先週分のデータを仕込む
  w14.save("bgm_work", wko);
  w14.renderWorkStats();
  check("週送り: 過去に記録があれば‹が有効", doc().getElementById("work-prev").disabled === false);
  doc().getElementById("work-prev").click();
  check("週送り: 前の7日間に切り替わり、その週の記録が見える",

  doc().getElementById("work-next").click();
  check("週送り: ›で直近7日に戻る", doc().getElementById("work-week-title").textContent === "直近7日");
  // 同期マージ: 作業実績は日別max、やることはupdatedAtが新しい方+削除が伝播
  const mW = w14.mergeData(
    { updatedAt: 1, bgm_work: { "2026-08-10": { sec: 100, pomo: 1 } },
      bgm_todos: { a: { text: "旧", done: false, updatedAt: 10 }, b: { text: "残る", done: false, updatedAt: 5 } } },
    { updatedAt: 2, bgm_work: { "2026-08-10": { sec: 300, pomo: 0 }, "2026-08-11": { sec: 60, pomo: 1 } },
      bgm_todos: { a: { text: "旧", done: false, deleted: true, updatedAt: 20 } } });
  eq("mergeData: bgm_workは日別・項目ごとmax", mW.bgm_work,
    { "2026-08-10": { sec: 300, pomo: 1 }, "2026-08-11": { sec: 60, pomo: 1 } });
  check("mergeData: やることは新しい方が勝ち、削除が伝播する",
    mW.bgm_todos.a.deleted === true && mW.bgm_todos.b.text === "残る");
  const mWR = w14.mergeData(
    { updatedAt: 1, workResetAt: Date.now() },
    { updatedAt: 2, bgm_work: { "2026-08-01": { sec: 50, pomo: 1 } }, bgm_todos: { x: { text: "古い", updatedAt: 50 } } });
  check("mergeData: workResetAt以前の作業実績・やることは復活しない",
    Object.keys(mWR.bgm_work).length === 0 && !mWR.bgm_todos.x);
  check("mergeData: bgm_pomoconfは新しい設定側が勝つ",
    w14.mergeData({ updatedAt: 1, bgm_pomoconf: { preset: "p25", sets: 1, auto: false } },
                  { updatedAt: 2, bgm_pomoconf: { preset: "p50", sets: 3, auto: true } }).bgm_pomoconf.sets === 3);
  // 掃除: 完了は90日残す(内容の振り返り用)、削除トンボストーンは30日
  const tp14 = w14.todosMap();
  tp14["old_done"] = { text: "40日前に完了", done: true, doneAt: Date.now() - 40 * 86400000, updatedAt: Date.now() - 40 * 86400000 };
  tp14["old_del"] = { text: "40日前に削除", done: false, deleted: true, updatedAt: Date.now() - 40 * 86400000 };
  tp14["ancient"] = { text: "100日前に完了", done: true, doneAt: Date.now() - 100 * 86400000, updatedAt: Date.now() - 100 * 86400000 };
  w14.save("bgm_todos", tp14);
  w14.pruneTodos();
  check("pruneTodos: 完了40日は残り、削除40日と完了100日は掃除される",
    !!w14.todosMap().old_done && !w14.todosMap().old_del && !w14.todosMap().ancient);
  // 設定: 自動再生+ポモドーロ(自動開始・時間・セット数)
  w14.showView("settings");
  check("設定: 自動再生トグル・タイマー自動開始・時間・セット数の設定がある",
    !!doc().getElementById("autoplay-toggle") && !!doc().getElementById("pomoauto-toggle") &&
    doc().querySelectorAll("#pomopreset-pills .toggle-pill").length === 2 &&
    doc().querySelectorAll("#pomosets-pills .toggle-pill").length === 4);
  doc().getElementById("autoplay-toggle").click();
  doc().getElementById("pomoauto-toggle").click();
  doc().querySelector('#pomopreset-pills .toggle-pill[data-key="p50"]').click();
  doc().querySelector('#pomosets-pills .toggle-pill[data-key="3"]').click();
  doc().getElementById("btn-save").click();
  await sleep(1000); // saveSettingsは700ms後に画面遷移する
  const conf14 = JSON.parse(localStorage.getItem("bgm_pomoconf"));
  check("保存: ポモドーロ設定(50分×3セット・自動開始オン)が保存される",
    conf14.preset === "p50" && conf14.sets === 3 && conf14.auto === true, JSON.stringify(conf14));
  check("自動再生設定が保存される(bgm_autoplay=true)",
    localStorage.getItem("bgm_autoplay") === "true" && w14.autoplayOn() === true);
  check("mergeData: bgm_autoplayは新しい設定側が勝つ",
    w14.mergeData({ updatedAt: 1, bgm_autoplay: false }, { updatedAt: 2, bgm_autoplay: true }).bgm_autoplay === true);
  // 開いたときのタイマー自動開始(直近1時間使っていなければ設定どおり開始)
  w14.savePomo(Object.assign(w14.pomoIdle(), { lastRunAt: 0 }));
  w14.maybeAutoStartPomo();
  const auto14 = w14.pomoState();
  check("自動開始: 設定どおり50分×3セットで作業が始まる",
    auto14.mode === "work" && auto14.preset === "p50" && auto14.sets === 3, JSON.stringify(auto14));
  w14.pomoStop(); // lastRunAt=いま
  w14.maybeAutoStartPomo();
  check("自動開始: 終了・中断から1時間以内の開き直しでは始めない", w14.pomoState().mode === "idle");
  // applyData: 作業系・自動再生・ポモドーロ設定の型ガード
  seedLS({});
  w14.applyData({ bgm_work: "broken", bgm_todos: 5, bgm_autoplay: "yes", bgm_pomoconf: "bad", bgm_ratings: { ok: { rating: 5, ratedAt: NOW_ISO } } });
  check("applyData: 作業系・自動再生の不正型は書き込まない(正しい型は書く)",
    localStorage.getItem("bgm_work") === null && localStorage.getItem("bgm_todos") === null &&
    localStorage.getItem("bgm_autoplay") === null && localStorage.getItem("bgm_pomoconf") === null &&
    !!localStorage.getItem("bgm_ratings"));
}

/* ==== 実行 ==== */
(async () => {
  const watchdog = setTimeout(() => {
    results.push({ suite: "実行", name: "タイムアウト(60秒以内に完了しない)", ok: false, detail: "" });
    renderResults(); reportToServer();
  }, 60000);
  try {
    await main();
  } catch (e) {
    results.push({ suite: "実行", name: "テスト実行中の例外", ok: false, detail: String(e && e.stack || e) });
  }
  clearTimeout(watchdog);
  renderResults();
  reportToServer();
})();
